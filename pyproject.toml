[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "neural-spectral-lab"
version = "0.1.0"
description = "Reproducible experiments on frequency learning in neural networks"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["torch>=2.0"]

[project.optional-dependencies]
dev = ["pytest>=8"]
plots = ["matplotlib>=3.7"]

[project.scripts]
spectral-lab = "spectral_lab.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
